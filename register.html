<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Create your ShopZone account.">

    <meta name="author"
        content="ShopZone">

    <title>Register | ShopZone</title>

    <link rel="icon"
        href="images/logo.png">

    <!-- Google Fonts -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="css/responsive.css">

</head>

<body>

    <!-- ===========================
            TOP BAR
    ============================ -->

    <section class="top-bar">

        <div class="container">

            <div class="top-bar-left">

                <p>

                    🚚 Free Shipping On Orders Above $500

                </p>

            </div>

            <div class="top-bar-right">

                <a href="login.html">

                    Login

                </a>

                <a class="active"
                    href="register.html">

                    Register

                </a>

            </div>

        </div>

    </section>

    <!-- ===========================
            HEADER
    ============================ -->

    <header id="mainHeader">

        <div class="container">

            <a href="index.html"
                class="logo">

                <img
                    src="images/logo.png"
                    alt="ShopZone Logo">

                <span>

                    ShopZone

                </span>

            </a>

            <nav id="navbar">

                <ul class="nav-links">

                    <li><a href="index.html">Home</a></li>

                    <li><a href="products.html">Products</a></li>

                    <li><a href="wishlist.html">Wishlist</a></li>

                    <li><a href="cart.html">Cart</a></li>

                </ul>

            </nav>

        </div>

    </header>

    <!-- ===========================
            REGISTER
    ============================ -->

    <section class="auth-page">

        <div class="container">

            <div class="auth-card">

                <h1>

                    Create Account

                </h1>

                <p>

                    Join ShopZone and start shopping today.

                </p>

                <form id="registerForm">

                    <div class="form-group">

                        <label>

                            Full Name

                        </label>

                        <input
                            type="text"
                            id="registerName"
                            placeholder="Enter your full name"
                            required>

                    </div>

                    <div class="form-group">

                        <label>

                            Email Address

                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="form-group">

                        <label>

                            Password

                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            required>

                    </div>

                    <div class="form-group">

                        <label>

                            Confirm Password

                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="fas fa-user-plus"></i>

                        Create Account

                    </button>

                </form>

                <div class="auth-links">

                    <p>

                        Already have an account?

                        <a href="login.html">

                            Login Here

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </section>

    <!-- ===========================
            FOOTER
    ============================ -->

    <footer id="mainFooter">

        <div class="container">

            <p>

                &copy; 2026 ShopZone Designed and Developed by Kazeem Abdulazeez. All Rights Reserved.

            </p>

        </div>

    </footer>

    <!-- ===========================
            JAVASCRIPT
    ============================ -->

    <script src="js/auth.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
